<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="theme-toggle">
      <span class="icon">🌙</span>
      <label class="switch">
        <input type="checkbox" id="theme-toggle" aria-label="Cambiar entre modo oscuro y claro" />
        <span class="slider"></span>
      </label>
      <span class="icon">☀️</span>
    </div>
    <div class="top-bar">
      <h1 class="game-title">TETRIS</h1>
    </div>
    <div class="game-container">
      <aside class="panel panel-hold">
        <div class="panel-section hold-section" id="hold-section">
          <span class="label">HOLD</span>
          <canvas id="hold-canvas" width="120" height="120"></canvas>
        </div>
      </aside>

      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>C</kbd> reservar</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>

        <!-- ---- Records: sección del panel lateral ---- -->
        <div class="panel-section records-panel">
          <span class="label">RECORDS</span>
          <ol class="records-list" id="panel-records-list"></ol>
          <div class="records-stats">
            <span>Mejor combo: <span id="panel-best-combo">0</span></span>
            <span>Máx. líneas: <span id="panel-max-lines">0</span></span>
          </div>
        </div>
        <!-- ---- Fin Records panel ---- -->
      </aside>

      <div id="overlay" class="overlay hidden">
        <div class="overlay-box">
          <p id="overlay-title">GAME OVER</p>
          <p id="overlay-score"></p>

          <!-- ---- Records: formulario de nombre (solo game over, si califica) ---- -->
          <div id="record-form" class="record-form hidden">
            <label for="record-name">¡Nuevo récord! Ingresá tu nombre:</label>
            <input type="text" id="record-name" maxlength="12" placeholder="Nombre" autocomplete="off" />
            <button id="record-save-btn">Guardar</button>
          </div>

          <div id="overlay-records" class="records-section hidden">
            <span class="label">RECORDS</span>
            <ol class="records-list" id="overlay-records-list"></ol>
            <div class="records-stats">
              <span>Mejor combo: <span id="overlay-best-combo">0</span></span>
              <span>Máx. líneas: <span id="overlay-max-lines">0</span></span>
            </div>
            <button id="reset-records-btn">Borrar récords</button>
          </div>
          <!-- ---- Fin Records overlay ---- -->

          <button id="restart-btn">Reiniciar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
